<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redline · Mars EVA Planner</title>
  <!-- .ico first for Safari and older browsers, PNG and SVG for the rest; ?v= forces a re-fetch when the icon changes -->
  <link rel="icon" href="favicon.ico?v=2" sizes="48x48">
  <link rel="icon" href="favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <meta name="theme-color" content="#12100e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css?v=20261115001605">
  <link rel="stylesheet" href="map.css?v=20261115001605">
  <link rel="stylesheet" href="panels.css?v=20261115001605">
  <link rel="stylesheet" href="tablet.css?v=20261115001605">
  <link rel="stylesheet" href="planner.css?v=20261115001605">
  <!-- Leaflet is a classic script: it defines window.L before app.js (a module) runs. -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="importmap" data-stamp>{"imports":{"./app.js":"./app.js?v=20261115001605","./events.js":"./events.js?v=20261115001605","./map.js":"./map.js?v=20261115001605","./minimap.js":"./minimap.js?v=20261115001605","./panels.js":"./panels.js?v=20261115001605","./planner.js":"./planner.js?v=20261115001605","./sim.js":"./sim.js?v=20261115001605","./smooth.js":"./smooth.js?v=20261115001605","./tablet.js":"./tablet.js?v=20261115001605","./util.js":"./util.js?v=20261115001605"}}</script>
  <script type="module" src="app.js?v=20261115001605"></script>
</head>
<body data-mode="planner">
  <header id="topbar">
    <div class="tb-group tb-brand">
      <img class="brand-logo" src="favicon.svg" alt="" width="22" height="22">
      <span class="brand-title">REDLINE<span class="brand-slash">/</span></span>
      <span id="fake-badge" class="badge badge-fake" hidden title="bounds.json / routes.json are marked fake: true">FAKE DATA</span>
      <span id="demo-badge" class="badge badge-demo" hidden>DEMO BUDGET</span>
    </div>

    <nav class="tb-views" id="mode-switch" aria-label="Views">
      <button type="button" class="view-tab" data-mode-btn="planner" aria-pressed="true" title="Habitat planner (1)">Planner</button>
      <button type="button" class="view-tab" data-mode-btn="tablet" aria-pressed="false" title="Astronaut tablet (2)">Astronaut tablet</button>
    </nav>

    <div class="tb-group tb-right">
      <span id="storm-chip" class="chip storm-chip" hidden title="Solar storm forecast (simulated): be inside the habitat before this runs out"></span>
      <span id="clock" class="clock" title="Sim time since leaving the habitat">T+0:00</span>
      <span id="status-chip" class="chip">idle</span>
      <button type="button" id="btn-play" class="btn btn-primary" title="Play / pause (space)">Play</button>
      <button type="button" id="btn-reset" class="btn btn-reset" title="Restart the walk from the habitat (r)" aria-label="Restart">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></svg></button>
    </div>
  </header>


  <main id="planner" aria-label="Habitat planner">
    <div id="map" aria-label="Map"></div>
    <aside id="layer-rail" aria-label="Map layers"></aside>
    <div id="goto"></div>
    <div id="layer-legend" aria-label="Legend of the layers that are on" hidden></div>
    <aside id="sheet-wrap" aria-label="Route sheet">
      <div id="route-sheet"></div>
      <div id="side-panel" aria-label="Mission details"></div>
    </aside>
  </main>

  <section id="tablet" aria-label="Astronaut tablet" hidden></section>

  <section id="event-pop" role="alertdialog" aria-label="Walk alert" hidden>
    <div class="ep-card">
      <span class="ep-k" data-k></span>
      <h2 class="ep-h" data-h></h2>
      <p class="ep-t" data-t></p>
      <div class="ep-facts" data-facts></div>
      <button type="button" class="ep-btn">Understood</button>
    </div>
  </section>

  <div id="toasts" aria-live="polite"></div>

  <div id="load-error" role="alert" hidden></div>
</body>
</html>
